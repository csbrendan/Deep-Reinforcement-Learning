<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" font-family="sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>The agent-environment feedback loop</title>
<desc>An agent containing a policy sends actions to the environment. The environment returns the next state and reward. This loop repeats every timestep.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="60" y="80" width="200" height="120" rx="12" fill="#534AB7" fill-opacity="0.10" stroke="#534AB7" stroke-width="1.5"/>
<text x="160" y="108" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Agent</text>
<rect x="90" y="128" width="140" height="50" rx="8" fill="#534AB7" fill-opacity="0.20" stroke="#534AB7" stroke-width="0.5"/>
<text x="160" y="150" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">policy π(a | s)</text>
<text x="160" y="168" text-anchor="middle" font-size="12" fill="#3C3489">what to do</text>

<rect x="420" y="80" width="200" height="120" rx="12" fill="#1D9E75" fill-opacity="0.10" stroke="#1D9E75" stroke-width="1.5"/>
<text x="520" y="108" text-anchor="middle" font-size="14" font-weight="500" fill="#0F6E56">Environment</text>
<rect x="450" y="128" width="140" height="50" rx="8" fill="#1D9E75" fill-opacity="0.20" stroke="#1D9E75" stroke-width="0.5"/>
<text x="520" y="148" text-anchor="middle" font-size="14" font-weight="500" fill="#0F6E56">P(s' | s, a),  r(s, a)</text>
<text x="520" y="166" text-anchor="middle" font-size="12" fill="#0F6E56">dynamics + reward</text>

<path d="M260 110 Q 340 60, 420 110" fill="none" stroke="#534AB7" stroke-width="2" marker-end="url(#arrow)"/>
<text x="340" y="60" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">action  a_t</text>

<path d="M420 170 Q 340 220, 260 170" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow)"/>
<text x="340" y="240" text-anchor="middle" font-size="14" font-weight="500" fill="#0F6E56">state  s_(t+1),   reward  r_t</text>

<text x="340" y="258" text-anchor="middle" font-size="12" fill="#5F5E5A">repeat for t = 0, 1, 2, …  →  trajectory τ = (s₀, a₀, r₀, s₁, a₁, r₁, …)</text>
<text x="500" y="44" text-anchor="middle" font-size="12" fill="#5F5E5A">RL goal:  max  E[ Σ γᵗ r_t ]</text>
</svg>
