<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>The OOD action problem in offline RL</title>
<desc>Learned Q matches truth on dataset actions but extrapolates wildly on out-of-distribution actions; a policy maximizing Q chases fake gains.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<line x1="60" y1="260" x2="640" y2="260" stroke="#888780" stroke-width="0.8" marker-end="url(#arrow)"/>
<line x1="80" y1="280" x2="80" y2="40" stroke="#888780" stroke-width="0.8" marker-end="url(#arrow)"/>
<text x="638" y="246" text-anchor="end" font-size="12">action a</text>
<text x="92" y="48" font-size="12">Q(s,a)</text>

<path d="M90 200 Q 200 130, 360 120 T 630 200" fill="none" stroke="#1D9E75" stroke-width="2"/>
<text x="225" y="155" font-size="12" fill="#0F6E56">true Q</text>

<path d="M260 175 Q 320 145, 400 142 T 510 165" fill="none" stroke="#185FA5" stroke-width="2.2"/>
<path d="M90 220 Q 160 110, 260 175" fill="none" stroke="#E24B4A" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M510 165 Q 580 60, 630 95" fill="none" stroke="#E24B4A" stroke-width="2" stroke-dasharray="5 4"/>

<circle cx="280" cy="170" r="3.5" fill="#185FA5"/>
<circle cx="335" cy="148" r="3.5" fill="#185FA5"/>
<circle cx="395" cy="142" r="3.5" fill="#185FA5"/>
<circle cx="450" cy="150" r="3.5" fill="#185FA5"/>
<circle cx="495" cy="160" r="3.5" fill="#185FA5"/>

<circle cx="600" cy="80" r="5" fill="#A32D2D" stroke="#fff" stroke-width="1"/>
<line x1="600" y1="80" x2="600" y2="260" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.5"/>

<line x1="260" y1="265" x2="510" y2="265" stroke="#185FA5" stroke-width="3"/>
<text x="385" y="285" text-anchor="middle" font-size="12" fill="#0C447C">data support</text>

<text x="600" y="55" text-anchor="middle" font-size="12" fill="#A32D2D">"unseen action"</text>
<text x="600" y="278" text-anchor="middle" font-size="12" fill="#A32D2D">policy chases this</text>
<text x="155" y="110" font-size="12" fill="#A32D2D">extrapolation</text>
<text x="155" y="125" font-size="12" fill="#A32D2D">errors</text>

<rect x="40" y="295" width="14" height="3" fill="#1D9E75"/>
<text x="60" y="300" font-size="12">true</text>
<rect x="100" y="295" width="14" height="3" fill="#185FA5"/>
<text x="120" y="300" font-size="12">learned Q (in-data)</text>
<rect x="240" y="295" width="14" height="3" fill="#E24B4A"/>
<text x="260" y="300" font-size="12">extrapolated (OOD)</text>
</svg>
