<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>RLHF vs DPO architectures</title>
<desc>RLHF trains a reward model and runs PPO. DPO collapses the same KL-constrained objective into a direct supervised loss on preference pairs.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="170" y="28" text-anchor="middle" font-size="14" font-weight="500">RLHF (two stages, online RL)</text>
<text x="510" y="28" text-anchor="middle" font-size="14" font-weight="500">DPO (one stage, supervised)</text>

<rect x="40" y="60" width="100" height="44" rx="8" fill="#534AB7" fill-opacity="0.15" stroke="#534AB7" stroke-width="0.6"/>
<text x="90" y="80" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">prefs</text>
<text x="90" y="96" text-anchor="middle" font-size="12" fill="#3C3489">y_w ≻ y_l</text>

<rect x="200" y="60" width="100" height="44" rx="8" fill="#534AB7" fill-opacity="0.15" stroke="#534AB7" stroke-width="0.6"/>
<text x="250" y="80" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">reward model</text>
<text x="250" y="96" text-anchor="middle" font-size="12" fill="#3C3489">r_φ(x,y)</text>

<line x1="140" y1="82" x2="197" y2="82" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="120" y="160" width="100" height="44" rx="8" fill="#1D9E75" fill-opacity="0.15" stroke="#1D9E75" stroke-width="0.6"/>
<text x="170" y="180" text-anchor="middle" font-size="14" font-weight="500" fill="#0F6E56">π_θ</text>
<text x="170" y="196" text-anchor="middle" font-size="12" fill="#0F6E56">policy</text>

<rect x="40" y="230" width="260" height="44" rx="8" fill="#D3D1C7" fill-opacity="0.4" stroke="#888780" stroke-width="0.6"/>
<text x="170" y="250" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">π_ref</text>
<text x="170" y="266" text-anchor="middle" font-size="12" fill="#5F5E5A">KL anchor (frozen)</text>

<path d="M250 104 Q 250 140, 220 160" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270" y="135" font-size="12" fill="#3C3489">PPO update</text>

<line x1="170" y1="230" x2="170" y2="206" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="195" y="222" font-size="12" fill="#5F5E5A">KL</text>

<rect x="380" y="60" width="100" height="44" rx="8" fill="#534AB7" fill-opacity="0.15" stroke="#534AB7" stroke-width="0.6"/>
<text x="430" y="80" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">prefs</text>
<text x="430" y="96" text-anchor="middle" font-size="12" fill="#3C3489">y_w ≻ y_l</text>

<rect x="540" y="160" width="100" height="44" rx="8" fill="#1D9E75" fill-opacity="0.15" stroke="#1D9E75" stroke-width="0.6"/>
<text x="590" y="180" text-anchor="middle" font-size="14" font-weight="500" fill="#0F6E56">π_θ</text>
<text x="590" y="196" text-anchor="middle" font-size="12" fill="#0F6E56">policy</text>

<rect x="380" y="230" width="260" height="44" rx="8" fill="#D3D1C7" fill-opacity="0.4" stroke="#888780" stroke-width="0.6"/>
<text x="510" y="250" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">π_ref</text>
<text x="510" y="266" text-anchor="middle" font-size="12" fill="#5F5E5A">KL anchor (frozen)</text>

<path d="M430 104 Q 430 140, 540 175" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="448" y="148" font-size="12" fill="#3C3489">direct loss</text>

<line x1="510" y1="230" x2="585" y2="206" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="560" y="225" font-size="12" fill="#5F5E5A">log ratio</text>

<text x="170" y="298" text-anchor="middle" font-size="12" fill="#5F5E5A">Reward model + policy optimization</text>
<text x="510" y="298" text-anchor="middle" font-size="12" fill="#0F6E56">Preference pairs + direct loss</text>
</svg>
